name: Feature request
description: Something the SDK should do that it does not
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The API or behaviour you have in mind, if any.
